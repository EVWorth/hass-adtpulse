[project]
authors = [{ name = "evworth" }, { name = "rsnodgrass" }]
name = "hass-adtpulse"

description = "Home Assistant integration for ADT Pulse"
readme = "README.md"
requires-python = ">=3.14.3"
version = "0.8.0"

dependencies = ["homeassistant>=2026.3.0", "pyadtpulse>=2.0.0"]

[dependency-groups]
dev = [
    "commitizen==4.19.4",
    "pre-commit>=4.3.0",
    # Exact pin: ruff-action in the Validate workflow installs this version.
    # Keep it in sync with the ruff-pre-commit rev in .pre-commit-config.yaml.
    "ruff==0.17.6",
]
test = [
    # The plugin pins an exact homeassistant. Without a floor, a homeassistant
    # release the plugin doesn't support yet makes uv fall back to an ancient
    # plugin (0.2.1, pytest 6), which can't run on Python 3.14.
    "pytest-homeassistant-custom-component>=0.13.375",
]

[tool.uv]
required-version = ">=0.10.0"
# Skip releases younger than 2 days (matches Dependabot's cooldown). To try a
# brand-new release anyway: uv lock --exclude-newer-package "NAME=0 days"
exclude-newer = "2 days"
# pyadtpulse is ours, and a release often needs this repo to follow it at once.
exclude-newer-package = { pyadtpulse = false }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 88         # Matches black
show-fixes = true
target-version = "py314"

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = "dynamic"
line-ending = "auto"

[tool.ruff.lint]
ignore = [
    "D105",    #missing-docstring-in-init
    "PLR2004", #Magic Values
    "D203",    #no-blank-line-before-class
    "D212",    #multi-line-summary-first-line
]
select = [
    "I",   # isort
    "F",   # plake8-bugbear
    "E",   # pycoyflakes
    "W",
    "D",   # pydocstyle
    "PL",  # pylint
    "RUF", # ruff
    "UP",  # pyupgrade
]
[tool.ruff.lint.pylint]
max-args = 10

[tool.ruff.lint.isort]
length-sort = true
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.commitizen]
# Releases are cut automatically from conventional commits on main: see
# .github/workflows/release.yaml. feat -> minor, fix/perf/refactor -> patch;
# docs/ci/build/chore/test don't release.
name = "cz_conventional_commits"
version_provider = "pep621"     # [project].version, plus version_files below
version_files = ["custom_components/adtpulse/manifest.json:\"version\""]
tag_format = "$version"          # existing tags are 0.8.0 etc., no "v"
update_changelog_on_bump = true
changelog_incremental = true     # keep the hand-written history below new entries
bump_message = "bump: version $current_version → $new_version"
major_version_zero = true
